<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember &amp; Oak Coffee | Concept by Abdullah Shah</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../demo.css">
</head>
<body>
<div class="wrap">
<a href="../../">Back to portfolio</a>
<h1>Ember &amp; Oak Coffee</h1>
<p class="sub">A concept café site: browse the menu, build an order and book a table. It all runs in your browser and nothing is sent anywhere.</p>

<section class="panel"><h2>Menu</h2><div class="chips" id="chips"></div><div class="grid" id="menu"></div></section>
<section class="panel"><h2>Your order</h2><div id="cart"></div><p class="tot"><span>Total</span><span id="tot">Rs 0</span></p></section>
<section class="panel">
  <h2>Book a table</h2>
  <form id="f" novalidate>
    <label>Name<input name="n" autocomplete="name"></label>
    <label>Phone<input name="p" type="tel" autocomplete="tel"></label>
    <label>Date<input name="d" type="date"></label>
    <label>Guests<input name="g" type="number" min="1" max="12" value="2"></label>
    <button class="btn">Book table</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
</section>
</div>

<script>
const $ = s => document.querySelector(s), Rs = n => 'Rs ' + n.toLocaleString('en-US');
const M = [['Coffee','Flat White','Double shot, silky milk',450],['Coffee','Cold Brew','Steeped for 18 hours',500],['Coffee','Espresso','Short and strong',300],['Coffee','Karak Chai','Cardamom, strong, hot',250],['Food','Butter Croissant','Baked every morning',380],['Food','Club Sandwich','Chicken, egg, house sauce',690],['Food','Cinnamon Roll','Warm and glazed',420],['Dessert','Brownie','Dark chocolate, sea salt',390],['Dessert','Cheesecake','Baked, berry compote',550]];
const cats = ['All', ...new Set(M.map(m => m[0]))], cart = {};
let cat = 'All';

function menu() {
  $('#chips').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === cat}" data-c="${c}">${c}</button>`).join('');
  $('#menu').innerHTML = M.filter(m => cat === 'All' || m[0] === cat).map(m =>
    `<div class="item"><h3>${m[1]}</h3><p>${m[2]}</p><div class="row"><b>${Rs(m[3])}</b><button class="btn" data-a="${m[1]}">Add</button></div></div>`).join('');
}
function order() {
  let t = 0; const ks = Object.keys(cart);
  $('#cart').innerHTML = ks.length ? ks.map(k => {
    t += M.find(m => m[1] === k)[3] * cart[k];
    return `<div class="line"><span>${k} x ${cart[k]}</span><span><button class="btn alt" data-m="${k}" aria-label="Remove one ${k}">-</button> <button class="btn alt" data-p="${k}" aria-label="Add one ${k}">+</button></span></div>`;
  }).join('') : '<p class="sub">Nothing yet. Add something from the menu.</p>';
  $('#tot').textContent = Rs(t);
}
document.addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.c) { cat = d.c; menu(); }
  if (d.a) { cart[d.a] = (cart[d.a] || 0) + 1; order(); }
  if (d.p) { cart[d.p]++; order(); }
  if (d.m) { if (--cart[d.m] < 1) delete cart[d.m]; order(); }
});

const f = $('#f');
f.d.min = new Date().toISOString().slice(0, 10);
f.addEventListener('submit', e => {
  e.preventDefault();
  const n = f.n.value.trim(), p = f.p.value.replace(/\D/g, ''), d = f.d.value, g = +f.g.value;
  let er = '';
  if (n.length < 2) er = 'Please enter your name.';
  else if (p.length < 10) er = 'Enter a phone number with at least 10 digits.';
  else if (!d || d < f.d.min) er = 'Pick today or a future date.';
  else if (!(g >= 1 && g <= 12)) er = 'Guests must be between 1 and 12.';
  const m = $('#msg');
  m.style.color = er ? 'var(--ember)' : 'var(--ok)';
  m.textContent = er || `Table for ${g} booked on ${d}. See you soon, ${n}! (Demo only: nothing was sent.)`;
  if (!er) f.reset();
});
menu(); order();
</script>
</body>
</html>
